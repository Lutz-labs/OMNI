name: ci

on:
  workflow_dispatch:

  push:
    branches: [main, omni-dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

      # Build the APK independently so it can be uploaded even if lint reports issues.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug
